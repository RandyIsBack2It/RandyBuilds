# Static server for randybuilds.tech. Serves the Astro build from the root,
# unprivileged on :8080. TLS, HTTP→HTTPS and www→apex happen at the edge
# (Caddy); these headers are repeated there so either layer is safe alone.

# Login attempts for private client previews, all visitors together (the gate
# also limits failed attempts per visitor).
limit_req_zone $server_name zone=preview_login:1m rate=20r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml text/plain application/manifest+json;
  gzip_min_length 512;

  # Cloudflare Web Analytics (cookieless) is injected at the edge. Its beacon and Cloudflare Turnstile
  # (the forms' spam check, src/scripts/contact.ts) are the only third parties allowed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Contact form → the mailer container (randybuilds-tech-mail network only),
  # resolved per request so pages still serve while it restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $mailer http://randybuilds-tech-mailer:8081;
  location = /api/contact {
    client_max_body_size 16k;
    limit_except POST { deny all; }
    proxy_pass $mailer;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
  }
  location /api/ { return 404; }

  # ── Private previews and client projects ───────────────────────────────
  # /preview/ (+ its two message pages) is the public vault (code form).
  # /preview/<id>/ = concept sites for prospects; /clients/<id>/ = full
  # projects for clients who said yes; /preview/vault/ = master-key index.
  # All of those are served from /usr/share/nginx/private — NOT the public
  # root — only after the gate container (auth_request) accepts the session
  # cookie for that path. No session → back to the vault, whether or not the
  # path exists. No analytics: the CSP allows only this origin.
  set $gate http://randybuilds-tech-gate:8082;
  set $gate_check http://randybuilds-tech-gate:8082/api/preview/check;
  location = /preview { return 301 /preview/; }
  location ~ ^/clients/?$ { return 302 /preview/; }   # clients use the same vault
  location ~ ^/preview/(try-again/|too-many-attempts/)?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;   # no-referrer would make the form post Origin: null
    add_header X-Frame-Options "DENY" always;
    try_files $uri/index.html =404;
  }
  location = /api/preview/login {
    client_max_body_size 2k;
    limit_except POST { deny all; }
    limit_req zone=preview_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $gate;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location = /_preview_auth {
    internal;
    proxy_pass $gate_check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location ~ ^/(preview|clients)/ {   # after the public regexes above: first match wins
    root /usr/share/nginx/private;
    auth_request /_preview_auth;
    error_page 401 403 500 502 503 504 = @preview_login;
    error_page 404 /404.html;   # a location-level error_page drops the server one
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    # Not in this image → the static client container (clients/Dockerfile).
    # The gate has already accepted the session by the time try_files runs.
    try_files $uri $uri/index.html @client_static;
  }
  # Static client projects, updated on their own with `tech clients`. Resolved
  # per request, so the site keeps serving while that container restarts.
  set $client_static http://randybuilds-tech-clients:8080;
  location @client_static {
    proxy_pass $client_static;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
  }
  location @preview_login {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /preview/;
  }

  # ── Share-link manager ─────────────────────────────────────────────────
  # /admin/ (+ its two message pages) is the public sign-in form, from the
  # footer's >_ mark. Every other /admin/ path is served from the private
  # root only after the gate accepts a master-key session (gate/server.mjs:
  # no other code opens it); otherwise back to the sign-in form.
  location = /admin { return 301 /admin/; }
  location ~ ^/admin/(try-again/|too-many-attempts/)?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;   # the form must post a real Origin
    add_header X-Frame-Options "DENY" always;
    try_files $uri/index.html =404;
  }
  location ~ ^/api/admin/(login|logout)$ {
    client_max_body_size 2k;
    limit_except POST { deny all; }
    limit_req zone=preview_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $gate;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location ~ ^/admin/ {   # after the public regex above: first match wins
    root /usr/share/nginx/private;
    auth_request /_preview_auth;
    error_page 401 403 500 502 503 504 = @admin_login;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;   # sign-out posts a real Origin
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/index.html =404;
  }
  location @admin_login {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /admin/;
  }

  # ── Share links ────────────────────────────────────────────────────────
  # /p/<code>/: the home page with one project featured (public, not
  # listed, noindex; the code is opaque). An unknown code, or an old
  # /p/<slug>/ address, opens the plain home page.
  location ~ ^/p/?$ { return 302 /; }
  location ^~ /p/ {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/index.html @home;
  }
  location @home {
    add_header Cache-Control "no-store" always;
    return 302 /;
  }

  # Renamed project page.
  location ~ ^/work/social-platform/?$ { return 301 /work/unmaskd/; }
  # Former pages, now sections of the one-page home. /services/ (2026-10-14) and
  # /work/ (2026-10-18) are pages again.
  location ~ ^/(about|faq|contact)/?$ { return 301 /#$1; }
  # The demo gallery became /work/; keep ?similar=<slug> working.
  location ~ ^/demos/?$ { return 301 /work/$is_args$args; }
  # ── Resources (WordPress) ─────────────────────────────────────────────
  # /resources/ is the WordPress site in wordpress/ (Compose project randybuilds-resources,
  # container randybuilds-resources on the randybuilds-resources-edge network). The path is
  # passed unchanged (Apache aliases /resources there). Only the suggest form is this build's.
  # WordPress pages get their own headers: the CSP above would block its admin and editor.
  set $resources http://randybuilds-resources:80;
  location ~ ^/resources/guides/([a-z0-9-]+)/?$ { return 301 /resources/$1/; }   # the old Astro guide URLs
  location ~ ^/resources/guides/?$ { return 301 /resources/topic/guides/; }
  location = /resources { return 301 /resources/; }
  location = /resources/suggest { return 301 /resources/suggest/; }
  location /resources/suggest/ { try_files $uri $uri/index.html =404; }
  location ~ ^/resources/(xmlrpc\.php|wp-admin/install\.php|wp-admin/setup-config\.php|readme\.html|license\.txt|wp-config[^/]*\.php)$ { return 404; }
  location /resources/ {
    client_max_body_size 24m;
    proxy_pass $resources;
    proxy_set_header Host randybuilds.tech;   # WordPress's own address, also on the local preview
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /healthz.txt { access_log off; add_header Cache-Control "no-store"; try_files $uri =404; }

  location / {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    # $uri/ (not $uri/index.html): /services 301s to /services/ instead of serving a duplicate.
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
