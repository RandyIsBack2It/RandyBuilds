# RandyBuilds.tech resource center (WordPress) at resources.randybuilds.tech.
# Its own Compose project, separate from the static site (randybuilds-tech)
# and from every other stack on this host. Manage it with wordpress/rbr.sh.
#
#   db          MariaDB, on an internal network only (no host port, no internet)
#   wordpress   Apache + PHP, reachable by the edge proxy on randybuilds-resources-edge
#   cli         WP-CLI for setup, imports and maintenance (profile "tools": never runs on its own)
#
# Secrets live in wordpress/secrets/ (chmod 700, gitignored), created by `rbr.sh init`.
name: randybuilds-resources

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# wp-config.php is generated by the image from these variables. WP_HOME comes
# from RBR_HOME: the canonical https address unless rbr.sh runs the local test mode.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  RBR_HOME: ${RBR_HOME:-https://randybuilds.tech/resources}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', rtrim(getenv('RBR_HOME') ?: 'https://randybuilds.tech/resources', '/'));
    define('WP_SITEURL', WP_HOME);
    define('FORCE_SSL_ADMIN', str_starts_with(WP_HOME, 'https://'));
    define('WP_ENVIRONMENT_TYPE', 'production');
    define('DISALLOW_FILE_EDIT', true);
    define('WP_POST_REVISIONS', 25);
    define('WP_AUTO_UPDATE_CORE', 'minor');
    define('WP_DEBUG_DISPLAY', false);

services:
  db:
    image: mariadb:11.8
    container_name: randybuilds-resources-db
    restart: unless-stopped
    # MARIADB_DATABASE / _USER / _PASSWORD / _ROOT_PASSWORD
    env_file: [secrets/db.env]
    volumes:
      - db:/var/lib/mysql
    networks: [db]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }
    logging: *logging

  wordpress:
    image: wordpress:7.1.3-php8.4-apache
    container_name: randybuilds-resources
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    # WORDPRESS_DB_PASSWORD + the eight auth keys and salts
    env_file: [secrets/wp.env]
    environment: *wp-env
    volumes:
      # Uploads, plugins and installed themes. WordPress core itself comes from
      # the image (the image keeps it in an anonymous volume; `rbr.sh update`
      # renews that volume so a new image brings new core files).
      - wp-content:/var/www/html/wp-content
      - ./theme/randybuilds-resources:/var/www/html/wp-content/themes/randybuilds-resources:ro
      - ./php/rbr.ini:/usr/local/etc/php/conf.d/zz-rbr.ini:ro
      # Adds the /resources alias and the subdomain redirect (served at randybuilds.tech/resources/).
      - ./apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    # db: database only. egress: update checks and api.wordpress.org.
    # edge: shared only with the edge proxy (after `rbr.sh attach-edge`).
    networks: [db, egress, edge]
    expose: ["80"]           # no host port here; see compose.local.yaml
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/wp-includes/images/blank.gif') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }
    logging: *logging

  cli:
    image: wordpress:cli-2.12.0-php8.4
    profiles: [tools]
    user: "33:33"            # same uid as www-data in the Apache image
    depends_on:
      db: { condition: service_healthy }
    env_file: [secrets/wp.env]
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      HOME: /tmp
    volumes_from: [wordpress]
    volumes:
      - ./migrate:/migrate:ro
    networks: [db]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  db:
    name: randybuilds-resources-db
  wp-content:
    name: randybuilds-resources-wp-content

networks:
  # WordPress ↔ MariaDB only, no outside access.
  db:
    name: randybuilds-resources-db
    internal: true
  egress:
    name: randybuilds-resources-egress
  # Dedicated bridge shared only by WordPress and the edge proxy. External, so
  # this project can never delete it (created by rbr.sh).
  edge:
    name: randybuilds-resources-edge
    external: true
