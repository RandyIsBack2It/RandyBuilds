# The image's default site, plus two rules for serving WordPress at
# https://randybuilds.tech/resources/ (2026-10-27). The main site's nginx passes
# /resources/… here unchanged, so the same files answer under that path.
<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	Alias /resources /var/www/html

	# The old subdomain (still routed here by the edge proxy) moves to the main site's path.
	RewriteEngine On
	RewriteCond %{HTTP_HOST} ^resources\.randybuilds\.tech$ [NC]
	RewriteRule ^/?(.*)$ https://randybuilds.tech/resources/$1 [R=301,L]
</VirtualHost>
