# randybuilds-tech-clients: static client builds only. Reached solely by the
# main site's nginx over an internal network, after the preview gate; the main
# site adds the security headers (noindex, CSP, no-store).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  location = /healthz.txt { access_log off; }
  location / { try_files $uri $uri/index.html =404; }
}
